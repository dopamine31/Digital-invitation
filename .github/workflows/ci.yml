name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rasa
          POSTGRES_PASSWORD: rasa
          POSTGRES_DB: rasa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rasa" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://rasa:rasa@localhost:5432/rasa?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-123456
      ENCRYPTION_KEY: 7b6b9d1c1d4a4e2f8c0a5b3d7e9f1a2c4d6e8f0a1b3c5d7e9f1a2c4d6
      CSRF_SALT: ci-csrf-salt
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      WHATSAPP_ADAPTER: mock
      EMAIL_ADAPTER: mock
      PAYMENT_ADAPTER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: bash scripts/prisma-generate.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - name: E2E critical flow
        run: |
          npx playwright install --with-deps chromium
          npm start > /tmp/next.log 2>&1 &
          npx wait-on http://localhost:3000/api/health --timeout 120000 || (cat /tmp/next.log && exit 1)
          BASE_URL=http://localhost:3000 npm run test:e2e
